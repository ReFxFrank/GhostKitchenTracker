[project]
name = "seance-ingest"
version = "0.0.1"
description = "SEANCE ingest: fetch, normalize, classify, link. NYC-specific by design."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "duckdb>=1.1",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# python-geosupport requires NYC Geosupport Desktop Edition installed locally
# (free from DCP). Kept optional so the base image builds without it; the
# Geosupport data files are mounted/installed in Phase 1.
geosupport = ["python-geosupport>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
